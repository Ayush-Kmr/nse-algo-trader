name: backtest

# Saturdays 04:30 UTC (10:00 IST), and on demand. Re-runs the last 60 days through the engine,
# net of costs, and commits reports/backtest-latest.md.
on:
  schedule:
    - cron: "30 4 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m algo --quiet backtest
      - run: python -m algo --quiet signals
      - run: python -m algo --quiet walkforward
      - run: python -m algo weekly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python -m algo --quiet survey
      - run: python -m algo --quiet stability
        continue-on-error: true   # a failure shows in the committed report
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest-latest.md reports/backtest-latest.json reports/signals-latest.md reports/walkforward-latest.md reports/learn-latest.md reports/longtest-latest.md reports/survey-latest.md reports/stability-latest.md
          git diff --cached --quiet && exit 0
          git commit -m "backtest: $(date -u +%F)"
          git pull --rebase
          git push
