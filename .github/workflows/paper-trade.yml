name: paper-trade

# The real clock is cron-job.org, calling workflow_dispatch every 5 minutes, 09:32-15:27 IST
# (scripts/setup_cronjob.py), because GitHub's schedule skipped 71 of 72 ticks on its first day.
# The cron below is only a sparse backup, hourly at :17 IST, so it cannot burn the Actions minutes.
# The opening range (09:15-09:30) is read back from the bars, so no tick is needed before 09:30.
# Ticks run 2 minutes past the bar so Yahoo can finish it. The engine only acts on completed bars,
# expires signals older than `max_signal_age_bars`, and alerts on gaps (`max_tick_gap_minutes`).
on:
  schedule:
    - cron: "47 4-9 * * 1-5"
    - cron: "20 11,15 * * *"   # best effort, for Telegram commands outside market hours
  workflow_dispatch:

concurrency:
  group: trading-state   # one run at a time touches the state, shared with eod.yml
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # State between runs lives in the Actions cache (newest wins). If the cache is gone, the
      # copy committed by eod.yml in state/state.json is the fallback.
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: state/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: tick
        env:
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m algo tick

      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/state.json
          key: state-${{ github.run_id }}
